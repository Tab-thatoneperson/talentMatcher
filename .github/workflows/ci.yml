name: CI/CD — TalentMatcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: lint + unit tests ──────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ── CD: deploy to AWS EC2 ──────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH → pull & restart app only
        uses: appleboy/ssh-action@v1
        env:
          APP_JWT_SECRET:   ${{ secrets.JWT_SECRET }}
          APP_GEMINI_KEY:   ${{ secrets.GEMINI_API_KEY }}
          REPO_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_PRIVATE_KEY }}
          envs:     APP_JWT_SECRET,APP_GEMINI_KEY,REPO_TOKEN
          script: |
            set -euo pipefail

            FRESH_DEPLOY=false

            cleanup() {
              local code=$?
              if [ $code -ne 0 ]; then
                echo "── deploy failed (exit $code), cleaning up ──"
                rm -rf /opt/talentmatcher/node_modules /opt/talentmatcher/dist 2>/dev/null || true
                if [ "$FRESH_DEPLOY" = "true" ]; then
                  pm2 delete talentmatcher 2>/dev/null || true
                fi
                echo "── elasticsearch status ──"
                sudo systemctl status elasticsearch --no-pager -n 10 || true
                echo "── app logs ──"
                pm2 logs talentmatcher --lines 20 --nostream 2>/dev/null || true
              fi
            }
            trap cleanup EXIT

            # ── install Node.js 20 ──────────────────────────────────────────
            if ! node -v 2>/dev/null | grep -q "^v20"; then
              echo "── installing Node.js 20 ──"
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # ── install PM2 ─────────────────────────────────────────────────
            if ! command -v pm2 &> /dev/null; then
              echo "── installing PM2 ──"
              sudo npm install -g pm2
            fi

            # ── install Elasticsearch ────────────────────────────────────────
            if ! command -v elasticsearch &> /dev/null; then
              echo "── installing Elasticsearch ──"
              wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch \
                | sudo gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/9.x/apt stable main" \
                | sudo tee /etc/apt/sources.list.d/elastic-9.x.list
              sudo apt-get update && sudo apt-get install -y elasticsearch
              printf 'discovery.type: single-node\nxpack.security.enabled: false\nnetwork.host: 127.0.0.1\n' | sudo tee /etc/elasticsearch/elasticsearch.yml
              printf '%s\n' '-Xms256m' '-Xmx256m' | sudo tee /etc/elasticsearch/jvm.options.d/heap.options > /dev/null
              sudo systemctl daemon-reload
              sudo systemctl enable elasticsearch
            fi

            sudo systemctl start elasticsearch || true

            # ── port forward 80 → 3000 ───────────────────────────────────────
            if ! sudo iptables -t nat -C PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000 2>/dev/null; then
              sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 3000
              sudo apt-get install -y iptables-persistent netfilter-persistent 2>/dev/null || true
              sudo netfilter-persistent save || true
            fi

            # ── clone repo if needed ─────────────────────────────────────────
            if [ ! -d /opt/talentmatcher/.git ]; then
              sudo mkdir -p /opt/talentmatcher
              sudo chown "$(whoami)":"$(whoami)" /opt/talentmatcher
              git clone https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git /opt/talentmatcher
            fi

            cd /opt/talentmatcher

            echo "── pulling latest code ──"
            git remote set-url origin https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            echo "── writing .env ──"
            {
              echo "JWT_SECRET=${APP_JWT_SECRET}"
              echo "GEMINI_API_KEY=${APP_GEMINI_KEY}"
              echo "PORT=3000"
              echo "ELASTICSEARCH_NODE=http://localhost:9200"
            } > .env

            echo "── installing dependencies & building ──"
            npm ci
            NODE_OPTIONS=--max-old-space-size=400 npm run build

            echo "── waiting for elasticsearch ──"
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s" > /dev/null; then
                echo "elasticsearch is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "elasticsearch did not become healthy in time"
                sudo journalctl -u elasticsearch --no-pager -n 20
                exit 1
              fi
              echo "  waiting... ($i/30)"
              sleep 5
            done

            echo "── restarting app ──"
            if pm2 describe talentmatcher > /dev/null 2>&1; then
              pm2 reload talentmatcher
            else
              FRESH_DEPLOY=true
              pm2 start dist/main.js --name talentmatcher
              pm2 save
              sudo env PATH="$PATH:/usr/bin" pm2 startup systemd -u "$USER" --hp "$HOME" | tail -1 | sudo bash || true
            fi

            echo "── deploy complete ──"
            pm2 status
