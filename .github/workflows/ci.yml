name: CI/CD — TalentMatcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: lint + unit tests ──────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ── CD: deploy to AWS EC2 ──────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH → pull & restart app only
        uses: appleboy/ssh-action@v1
        env:
          APP_JWT_SECRET:   ${{ secrets.JWT_SECRET }}
          APP_GEMINI_KEY:   ${{ secrets.GEMINI_API_KEY }}
          REPO_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_PRIVATE_KEY }}
          envs:     APP_JWT_SECRET,APP_GEMINI_KEY,REPO_TOKEN
          script: |
            set -e

            if ! command -v docker &> /dev/null; then
              echo "── installing docker ──"
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
              sudo systemctl enable --now docker
            fi

            if [ ! -d /opt/talentmatcher/.git ]; then
              sudo mkdir -p /opt/talentmatcher
              sudo chown "$(whoami)":"$(whoami)" /opt/talentmatcher
              git clone https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git /opt/talentmatcher
            fi

            cd /opt/talentmatcher

            echo "── pulling latest code ──"
            git remote set-url origin https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            echo "── writing .env from github secrets ──"
            {
              echo "JWT_SECRET=${APP_JWT_SECRET}"
              echo "GEMINI_API_KEY=${APP_GEMINI_KEY}"
              echo "PORT=3000"
            } > .env
            # ELASTICSEARCH_NODE is intentionally omitted here —
            # docker-compose.prod.yml sets it to http://elasticsearch:9200
            # via the environment section, which takes precedence over .env

            echo "── ensuring elasticsearch is up (no-op if already healthy) ──"
            docker compose -f docker-compose.prod.yml up -d elasticsearch

            echo "── waiting for elasticsearch to be healthy ──"
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml ps elasticsearch \
                  | grep -q "healthy"; then
                echo "elasticsearch is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "elasticsearch did not become healthy in time"
                exit 1
              fi
              echo "  waiting... ($i/30)"
              sleep 5
            done

            echo "── rebuilding and restarting app only ──"
            docker compose -f docker-compose.prod.yml build app
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            echo "── pruning old images ──"
            docker image prune -f

            echo "── deploy complete ──"
            docker compose -f docker-compose.prod.yml ps
