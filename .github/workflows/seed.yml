name: Seed — Clear & Reseed Jobs

on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH → clear ES and reseed jobs
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/talentmatcher

            echo "── waiting for app to be ready ──"
            for i in $(seq 1 30); do
              if curl -s http://localhost:3000/api > /dev/null 2>&1; then
                echo "app is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "app did not become ready in time"
                pm2 logs talentmatcher --lines 20 --nostream
                exit 1
              fi
              echo "  waiting... ($i/30)"
              sleep 10
            done

            API_URL=http://localhost:3000 ES_URL=http://localhost:9200 node scripts/seed.js
