<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Talent Matcher - Browse Candidates</title>
    <link rel="stylesheet" href="../assets/css/shared.css">
</head>
<body>
    <div class="app-container">
        <header class="top-brand">
            <div class="brand-text">Intelligent talent matching platform</div>
            <nav class="top-nav">
                <a href="../membership/membership.html" id='member-link' class="nav-link">Become a member!</a>
                <span class="nav-link nav-active">Browse Candidates</span>
                <a href="../post-job/post-job.html" class="nav-link">Post a Job</a>
                <button class="nav-link nav-logout" onclick="clearSession();window.location.href='/login/login.html';">Log out</button>
            </nav>
        </header>
        <main class="main-content">
            <section class="page-header">
                <h1>Browse Candidates</h1>
                <p>Find talent for your open roles</p>
            </section>

            <!-- Top-K recommendations panel -->
            <div class="recommend-panel">
                <label class="recommend-label">Best candidates for a job:</label>
                <div class="recommend-row">
                    <select id="job-selector" class="filter-pill recommend-job-select">
                        <option value="">Select one of your jobs…</option>
                    </select>
                    <button id="recommend-btn" class="btn btn-recommend" disabled>&#9733; Find best candidates</button>
                </div>
            </div>

            <section class="search-area">
                <div class="input-group"><span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="18" height="18" viewBox="0 0 256 256" xml:space="preserve">
                        <g style="stroke: none; stroke-width: 0; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: none; fill-rule: nonzero; opacity: 1;" transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)">
                            <path d="M 88.271 79.927 L 71.011 62.666 c -0.631 -0.631 -1.574 -0.743 -2.327 -0.355 l -2.509 -2.509 c 11.408 -14.576 10.241 -35.733 -2.986 -48.96 C 56.197 3.851 46.902 0 37.015 0 S 17.833 3.851 10.842 10.842 C 3.851 17.833 0 27.128 0 37.015 s 3.851 19.182 10.842 26.173 c 7.171 7.172 16.671 10.798 26.191 10.798 c 8.04 0 16.095 -2.588 22.769 -7.812 l 2.509 2.509 c -0.388 0.753 -0.276 1.696 0.355 2.327 l 17.261 17.261 C 81.041 89.386 82.523 90 84.099 90 c 1.576 0 3.059 -0.614 4.173 -1.729 S 90 85.675 90 84.099 C 90 82.523 89.386 81.041 88.271 79.927 z M 58.596 58.596 c -5.95 5.95 -13.765 8.925 -21.581 8.925 c -7.815 0 -15.631 -2.975 -21.581 -8.925 c -11.9 -11.899 -11.9 -31.262 0 -43.162 c 11.9 -11.9 31.262 -11.899 43.162 0 C 70.496 27.333 70.496 46.696 58.596 58.596 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: rgb(0,0,0); fill-rule: nonzero; opacity: 1;" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                        </g>
                    </svg>
                </span><input id="search-input" type="text" placeholder="Skills, role or name"></div>
                <div class="input-group"><span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="18" height="18" viewBox="0 0 256 256" xml:space="preserve">
                        <g style="stroke: none; stroke-width: 0; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: none; fill-rule: nonzero; opacity: 1;" transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)">
                            <path d="M 45 0 c 15.103 0 27.389 12.287 27.389 27.389 C 72.389 46.616 46.147 66.607 45 90 c -1.147 -23.393 -27.389 -43.384 -27.389 -62.611 C 17.611 12.287 29.897 0 45 0 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: rgb(255,80,80); fill-rule: nonzero; opacity: 1;" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                            <circle cx="45.004999999999995" cy="26.575000000000003" r="9.205" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: rgb(191,0,3); fill-rule: nonzero; opacity: 1;" transform="  matrix(1 0 0 1 0 0) "/>
                        </g>
                    </svg>
                </span><input id="location-input" type="text" placeholder="Location"></div>
                <button id="search-btn" class="btn btn-primary">Search</button>
            </section>

            <section class="filter-group">
                <select id="filter-availability" class="filter-pill">
                    <option value="">Availability</option>
                    <option value="immediate">Immediate</option>
                    <option value="2weeks">2 Weeks</option>
                    <option value="1month">1 Month</option>
                </select>
                <select id="filter-experience" class="filter-pill">
                    <option value="">Experience</option>
                    <option value="junior">Junior</option>
                    <option value="mid">Mid</option>
                    <option value="senior">Senior</option>
                    <option value="lead">Lead</option>
                </select>
                <select id="filter-skills" class="filter-pill">
                    <option value="">Skills</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="React">React</option>
                    <option value="Node.js">Node.js</option>
                    <option value="SQL">SQL</option>
                </select>
                <select id="filter-industry" class="filter-pill">
                    <option value="">Industry</option>
                    <option value="Technology">Technology</option>
                    <option value="Finance">Finance</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Education">Education</option>
                    <option value="Sales">Sales</option>
                    <option value="Other">Other</option>
                </select>
            </section>

            <div class="results-bar">
                <span id="results-count" class="results-count"></span>
                <button id="clear-filters" class="clear-btn" style="display:none;">✕ Clear filters</button>
            </div>

            <section id="candidates-list" class="item-list">
                <p style="text-align:center;color:#666;padding:20px;">Loading candidates...</p>
            </section>
        </main>
    </div>

    <script src="../assets/js/auth-storage.js"></script>
    <script src="../assets/js/api-client.js"></script>
    <script src="browse-candidates.js"></script>
</body>
</html>
