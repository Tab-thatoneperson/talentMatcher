<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Talent Matcher - Post a Job</title>
    <link rel="stylesheet" href="../assets/css/shared.css">
</head>
<body>
    <div class="app-container">
        <header class="top-brand">
            <div class="brand-text">Intelligent talent matching platform</div>
            <nav class="top-nav">
                <a href="../membership/membership.html" id='member-link' class="nav-link">Become a member!</a>
                <a href="../browse-candidates/browse-candidates.html" class="nav-link">Browse Candidates</a>
                <span class="nav-link nav-active">Post a Job</span>
                <button class="nav-link nav-logout" onclick="clearSession();window.location.href='/login/login.html';">Log out</button>
            </nav>
        </header>
        <main class="main-content">
            <section class="page-header">
                <h1>Post a Job</h1>
                <p>Fill in the details to list your opening</p>
            </section>

            <div id="form-error" class="api-error"></div>
            <div id="form-success" class="api-success">Job posted successfully!</div>

            <form id="post-job-form">
                <h3 class="section-title">Job details</h3>

                <div class="form-group">
                    <label class="form-label">Job Title *</label>
                    <input id="job-title" type="text" class="form-control" placeholder="e.g. Software engineer">
                </div>

                <div class="form-row form-group">
                    <div class="form-col">
                        <label class="form-label">Industry</label>
                        <select id="job-industry" class="form-control">
                            <option value="">Select...</option>
                            <option value="Technology">Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Education">Education</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Sales">Sales</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label class="form-label">Job Type *</label>
                        <select id="job-type" class="form-control">
                            <option value="">Select...</option>
                            <option value="fulltime">Full-time</option>
                            <option value="parttime">Part-time</option>
                            <option value="contract">Contract</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Location *</label>
                    <input id="job-location" type="text" class="form-control" placeholder="City, Country">
                </div>

                <h3 class="section-title">Compensation</h3>
                <div class="form-row form-group">
                    <div class="form-col">
                        <label class="form-label">Min Salary</label>
                        <input id="salary-min" type="number" class="form-control" placeholder="$">
                    </div>
                    <div class="form-col">
                        <label class="form-label">Max Salary</label>
                        <input id="salary-max" type="number" class="form-control" placeholder="$">
                    </div>
                    <div class="form-col">
                        <label class="form-label">Period</label>
                        <select id="salary-period" class="form-control">
                            <option value="year">1 year</option>
                            <option value="month">1 month</option>
                            <option value="hour">Per hour</option>
                        </select>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="show-salary">
                    <label for="show-salary" class="checkbox-label">Show salary on listing</label>
                </div>

                <h3 class="section-title">Description &amp; Requirements</h3>
                <div class="form-group">
                    <label class="form-label">Job Description *</label>
                    <textarea id="job-description" class="form-control" placeholder="Describe the role and responsibilities..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Required Skills *</label>
                    <input id="skills-input" type="text" class="form-control" placeholder="Type a skill and press Enter" style="margin-bottom: 10px;">
                    <div id="skills-tags" class="tag-group"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Experience Level *</label>
                    <select id="experience-level" class="form-control">
                        <option value="">Select level...</option>
                        <option value="junior">Junior</option>
                        <option value="mid">Mid</option>
                        <option value="senior">Senior</option>
                        <option value="lead">Lead</option>
                    </select>
                </div>

                <h3 class="section-title">Application Settings</h3>
                <div class="form-group">
                    <label class="form-label">Application Deadline</label>
                    <input id="application-deadline" type="date" class="form-control">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="one-click">
                    <label for="one-click" class="checkbox-label">Allow candidates to apply with one click</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="notify-email" checked>
                    <label for="notify-email" class="checkbox-label">Notify me of new applications by email</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Post Job</button>
                <a href="../browse-candidates/browse-candidates.html" class="text-link text-center" style="color: #666;">Cancel</a>
            </form>
        </main>
    </div>

    <script src="../assets/js/auth-storage.js"></script>
    <script src="../assets/js/api-client.js"></script>
    <script src="post-job.js"></script>
</body>
</html>
