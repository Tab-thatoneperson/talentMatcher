<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Candidate and Employer</title>
    <link rel="stylesheet" href="login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div></div>
      <p>IntelligentTalentMatchingPlatform</p>
    </header>

    <div class="container">
      <div class="header-instructions">
        <h1>Log in</h1>
        <p>Enter your email and password</p>
      </div>

      <div class="input-container">
        <div>
          <p>Email Address</p>
          <input type="text" />
          <div class="invalid-message">
            <img src="../assets/attention-triangle.png" alt="" />
            <p>Please enter a valid email address</p>
          </div>
        </div>

        <div>
          <p>Password</p>
          <input type="password" id="password-field" />
          <div class="pw-message">
            <div class="invalid-message">
              <img src="../assets/attention-triangle.png" alt="" />
              <p>Passwords do not match</p>
            </div>
            <p><a href="">Forgot password?</a></p>
          </div>
        </div>
      </div>

      <a id="button-click"><b>Log in</b></a>

      <div class="divider"></div>

      <p>
        Don't have an account? Register
        <b
          ><a
            href="../create-account/create-account-candidate.html"
            class="switch-link"
            >here</a
          ></b
        >.
      </p>
    </div>
    <script src="login.js"></script>
  </body>
</html>
